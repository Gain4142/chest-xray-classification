# All new experiments use this file. Outputs save params.resolved.yaml.
experiment_id: vit_frozen_warmcos_8ep_ap_v1
models: [vit]
seeds: [42, 123, 2026]
epochs: 8
batch_size: 8
vit_training: frozen      # frozen | last_block | llrd
lr: 0.001                # frozen: 0.001; last_block/llrd: 0.00003
llrd_decay: 0.75          # Layer-wise LR decay; embeddings use decay^13.
scheduler: warmup_cosine  # constant | warmup_cosine
warmup_ratio: 0.1         # Fraction of optimizer update steps.
optimizer: adam
weight_decay: 0.0
pos_weight: null          # null: ordinary BCE; 3.0 for later comparison.
clahe: false
augmentation: false       # Not connected to the training runner yet.
selection_metric: auprc
threads: 4
device: cuda
output_root: outputs/models
data_config: experiments/data_split.json
